<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Solar Sun Rays -->
  <circle cx="256" cy="140" r="44" fill="url(#solarGrad)" />
  <g stroke="#fef08a" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="65" x2="256" y2="85" />
    <line x1="256" y1="195" x2="256" y2="215" />
    <line x1="181" y1="140" x2="201" y2="140" />
    <line x1="311" y1="140" x2="331" y2="140" />
    <line x1="203" y1="87" x2="217" y2="101" />
    <line x1="295" y1="179" x2="309" y2="193" />
    <line x1="203" y1="193" x2="217" y2="179" />
    <line x1="295" y1="101" x2="309" y2="87" />
  </g>
  <!-- Mini Cold Storage Chamber Outline -->
  <rect x="136" y="240" width="240" height="190" rx="24" fill="#ffffff" />
  <!-- Chamber Door / Divider -->
  <rect x="156" y="260" width="200" height="150" rx="16" fill="#f1f5f9" />
  <line x1="256" y1="260" x2="256" y2="410" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 4" />
  <!-- Snowflake / Cold Symbol -->
  <g stroke="url(#coolGrad)" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="256" y1="305" x2="256" y2="365" />
    <line x1="226" y1="335" x2="286" y2="335" />
    <line x1="235" y1="314" x2="277" y2="356" />
    <line x1="235" y1="356" x2="277" y2="314" />
    <!-- Flake branches -->
    <path d="M250,315 L256,310 L262,315" />
    <path d="M250,355 L256,360 L262,355" />
    <path d="M235,329 L230,335 L235,341" />
    <path d="M277,329 L282,335 L277,341" />
  </g>
  <!-- Green Sprout / Leaf at Top Left -->
  <path d="M120 220 C120 170 170 170 170 170 C170 210 135 225 120 220 Z" fill="#4ade80" />
  <path d="M120 220 C135 200 155 190 170 170" stroke="#166534" stroke-width="3" fill="none" />
</svg>
